
<h2 class="sr-only">กราฟเปรียบเทียบ % Sq. Meters Occupied จากเว็บไซต์กับที่คำนวณจาก CSV</h2>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
  <span style="font-size:13px;font-weight:500;">OCCUPANCY % — Sq. Meters Occupied</span>
  <div style="display:flex;gap:16px;font-size:12px;color:var(--color-text-secondary);">
    <span style="display:flex;align-items:center;gap:5px;"><span style="width:12px;height:12px;border-radius:2px;background:#B03030;display:inline-block;"></span>จากเว็บไซต์</span>
    <span style="display:flex;align-items:center;gap:5px;"><span style="width:12px;height:12px;border-radius:2px;background:#378ADD;display:inline-block;"></span>คำนวณจาก CSV</span>
  </div>
</div>
<div style="position:relative;width:100%;height:300px;">
  <canvas id="sqmChart" role="img" aria-label="Bar chart comparing reported pct_sqm from website vs calculated from CSV for each date in April-May 2026"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = ["01-4","02-4","03-4","04-4","05-4","06-4","07-4","08-4","09-4","10-4","11-4","12-4","13-4","14-4","15-4","16-4","17-4","18-4","19-4","20-4","21-4","22-4","23-4","24-4","25-4","26-4","27-4","28-4","29-4","30-4","01-5"];
const website = [1.4,1.5,1.5,1.5,1.5,1.5,1.5,1.4,1.5,1.5,1.5,1.4,1.4,1.4,1.4,1.4,1.4,1.4,1.4,1.3,1.2,1.2,1.2,1.2,1.0,0.9,0.9,0.9,1.0,0.9,0.7];
const calc   = [1.38,1.55,1.49,1.49,1.49,1.49,1.48,1.43,1.48,1.48,1.47,1.36,1.36,1.36,1.36,1.36,1.36,1.38,1.38,1.26,1.24,1.24,1.24,1.24,1.03,0.94,0.93,0.91,0.98,0.93,0.74];

new Chart(document.getElementById('sqmChart'), {
  type: 'bar',
  data: {
    labels,
    datasets: [
      { label:'จากเว็บไซต์', data:website, backgroundColor:'#B03030', borderRadius:3, borderSkipped:false, barPercentage:0.45, categoryPercentage:0.85 },
      { label:'คำนวณจาก CSV', data:calc, backgroundColor:'#378ADD', borderRadius:3, borderSkipped:false, barPercentage:0.45, categoryPercentage:0.85 }
    ]
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    plugins: {
      legend:{ display:false },
      tooltip:{ callbacks:{ label: ctx => {
        const val = ctx.parsed.y.toFixed(2);
        const other = ctx.datasetIndex===0 ? calc[ctx.dataIndex] : website[ctx.dataIndex];
        const diff = Math.abs(ctx.parsed.y - other).toFixed(2);
        return `${ctx.dataset.label}: ${val}%  (ต่างกัน ${diff}%)`;
      }}}
    },
    scales: {
      x:{ ticks:{ font:{size:10}, autoSkip:false, maxRotation:45 }, grid:{display:false} },
      y:{ min:0, max:2.0, ticks:{ callback: v=>v.toFixed(1)+'%', font:{size:11} }, grid:{color:'rgba(128,128,128,0.15)'} }
    }
  }
});
</script>

<div style="margin-top:1.25rem;">
  <p style="font-size:13px;color:var(--color-text-secondary);margin:0 0 0.5rem;">ผลต่างระหว่างเว็บไซต์กับที่คำนวณจาก CSV (ทุกวัน)</p>
  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead>
        <tr style="border-bottom:0.5px solid var(--color-border-tertiary);">
          <th style="text-align:left;padding:5px 8px;color:var(--color-text-secondary);font-weight:500;">วันที่</th>
          <th style="text-align:right;padding:5px 8px;color:var(--color-text-secondary);font-weight:500;">เว็บไซต์ %</th>
          <th style="text-align:right;padding:5px 8px;color:var(--color-text-secondary);font-weight:500;">คำนวณ %</th>
          <th style="text-align:right;padding:5px 8px;color:var(--color-text-secondary);font-weight:500;">ผลต่าง</th>
          <th style="text-align:center;padding:5px 8px;color:var(--color-text-secondary);font-weight:500;">สถานะ</th>
        </tr>
      </thead>
      <tbody id="diffBody"></tbody>
    </table>
  </div>
</div>
<script>
const lbl2=["01-4","02-4","03-4","04-4","05-4","06-4","07-4","08-4","09-4","10-4","11-4","12-4","13-4","14-4","15-4","16-4","17-4","18-4","19-4","20-4","21-4","22-4","23-4","24-4","25-4","26-4","27-4","28-4","29-4","30-4","01-5"];
const w2=[1.4,1.5,1.5,1.5,1.5,1.5,1.5,1.4,1.5,1.5,1.5,1.4,1.4,1.4,1.4,1.4,1.4,1.4,1.4,1.3,1.2,1.2,1.2,1.2,1.0,0.9,0.9,0.9,1.0,0.9,0.7];
const c2=[1.38,1.55,1.49,1.49,1.49,1.49,1.48,1.43,1.48,1.48,1.47,1.36,1.36,1.36,1.36,1.36,1.36,1.38,1.38,1.26,1.24,1.24,1.24,1.24,1.03,0.94,0.93,0.91,0.98,0.93,0.74];
const tbody=document.getElementById('diffBody');
lbl2.forEach((d,i)=>{
  const diff=(w2[i]-c2[i]).toFixed(2);
  const absDiff=Math.abs(diff);
  const isExact=absDiff<=0.05;
  const bg=i%2===0?'':'background:var(--color-background-secondary);';
  const statusColor=isExact?'color:var(--color-text-success);':'color:var(--color-text-warning);';
  const statusText=isExact?'✓ ใกล้เคียง':'~ ปัดเศษ';
  tbody.innerHTML+=`<tr style="${bg}">
    <td style="padding:4px 8px;">${d}</td>
    <td style="text-align:right;padding:4px 8px;">${w2[i].toFixed(1)}</td>
    <td style="text-align:right;padding:4px 8px;">${c2[i].toFixed(2)}</td>
    <td style="text-align:right;padding:4px 8px;">${diff>0?'+':''}${diff}</td>
    <td style="text-align:center;padding:4px 8px;${statusColor}">${statusText}</td>
  </tr>`;
});
</script>
